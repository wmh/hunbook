<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Pokémon GO 屬性相剋查詢表，支援攻擊與防禦雙模式，離線可用">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="屬性查詢">
  <link rel="manifest" href="pokego-types-manifest.json">
  <link rel="icon" type="image/svg+xml" href="pokego-types-icon.svg">
  <link rel="apple-touch-icon" href="pokego-types-icon.svg">
  <title>Pokémon GO 屬性查詢</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --bg2:     #161b22;
      --bg3:     #21262d;
      --text:    #e6edf3;
      --text2:   #8b949e;
      --accent:  #f3a23e;
      --border:  #30363d;
      --radius:  10px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100%;
    }

    /* ── Header ── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title small {
      font-size: 11px;
      font-weight: 400;
      color: var(--text2);
      background: var(--bg3);
      padding: 2px 7px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .tabs {
      display: flex;
    }

    .tab {
      flex: 1;
      padding: 10px 8px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-bottom: 3px solid transparent;
      background: none;
      color: var(--text2);
      transition: color 0.2s, border-color 0.2s;
      letter-spacing: 0.3px;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── Main ── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px 24px;
      -webkit-overflow-scrolling: touch;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    /* ── Type grid ── */
    .type-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 16px;
    }

    .type-btn {
      padding: 9px 4px;
      border-radius: 9px;
      border: 2.5px solid transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
      text-shadow: 0 1px 3px rgba(0,0,0,0.45);
      user-select: none;
      -webkit-user-select: none;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }

    .type-btn:active { transform: scale(0.93); }

    .type-btn.selected {
      border-color: #fff;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.25), 0 2px 8px rgba(0,0,0,0.4);
      transform: scale(1.04);
    }

    /* ── Defense hint ── */
    .defense-hint {
      font-size: 12px;
      color: var(--text2);
      text-align: center;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 14px;
      display: none;
    }

    /* ── Results ── */
    .empty-state {
      text-align: center;
      color: var(--text2);
      padding: 36px 20px;
      font-size: 14px;
      line-height: 1.7;
    }
    .empty-state .icon { font-size: 44px; margin-bottom: 10px; }

    .selected-display {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .selected-badge {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .selected-divider {
      color: var(--text2);
      font-size: 18px;
      font-weight: 300;
    }

    /* ── Effectiveness cards ── */
    .eff-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 13px;
      margin-bottom: 8px;
    }

    .eff-card.neutral { opacity: 0.45; }
    .eff-card.collapsible { cursor: pointer; }
    .eff-card.collapsible:active { background: var(--bg3); }

    .eff-header {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .eff-label {
      font-size: 13px;
      font-weight: 700;
      flex: 1;
    }

    .eff-mult {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 12px;
      letter-spacing: 0.3px;
    }

    .eff-count {
      font-size: 11px;
      color: var(--text2);
      margin-left: 4px;
    }

    /* Multiplier pill colours */
    .pill-256  { background: #c9002e; color: #fff; }
    .pill-160  { background: #e85500; color: #fff; }
    .pill-100  { background: #444c56; color: #aaa; }
    .pill-062  { background: #0058b0; color: #fff; }
    .pill-039  { background: #003d80; color: #fff; }
    .pill-024  { background: #2a0060; color: #fff; }

    .type-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .type-tag {
      padding: 4px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .pogo-note {
      text-align: center;
      font-size: 11px;
      color: var(--text2);
      margin-top: 16px;
      padding: 8px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <div class="title">
    ⚡ Pokémon GO 屬性查詢
    <small>PoGo 倍率</small>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-attack"  onclick="setMode('attack')">⚔️ 攻擊模式</button>
    <button class="tab"        id="tab-defense" onclick="setMode('defense')">🛡️ 防禦模式</button>
  </div>
</header>

<main>
  <div class="section-label" id="gridLabel">選擇攻擊屬性</div>
  <div class="type-grid" id="typeGrid"></div>
  <div class="defense-hint" id="defenseHint">可選 1～2 個屬性（雙屬性寶可夢），再次點擊取消選擇</div>
  <div id="results">
    <div class="empty-state">
      <div class="icon">🎮</div>
      點選上方屬性<br>查看相剋關係
    </div>
  </div>
</main>

<script>
// ── 屬性資料 ──────────────────────────────────────────
const TYPES = [
  'Normal','Fire','Water','Electric','Grass','Ice',
  'Fighting','Poison','Ground','Flying','Psychic','Bug',
  'Rock','Ghost','Dragon','Dark','Steel','Fairy'
];

const TYPE_ZH = {
  Normal:'一般', Fire:'火', Water:'水', Electric:'電',
  Grass:'草', Ice:'冰', Fighting:'格鬥', Poison:'毒',
  Ground:'地面', Flying:'飛行', Psychic:'超能力', Bug:'蟲',
  Rock:'岩石', Ghost:'幽靈', Dragon:'龍', Dark:'惡',
  Steel:'鋼', Fairy:'妖精'
};

// Pokémon GO 官方屬性顏色
const TYPE_COLORS = {
  Normal:   '#9099A1', Fire:     '#FF9741', Water:    '#3692DC',
  Electric: '#FBD100', Grass:    '#38BF4B', Ice:      '#70CEC0',
  Fighting: '#E0306A', Poison:   '#B567CE', Ground:   '#E87236',
  Flying:   '#89AAE3', Psychic:  '#FF6675', Bug:      '#83C300',
  Rock:     '#C8B686', Ghost:    '#4C6AB2', Dragon:   '#006FC9',
  Dark:     '#5B5466', Steel:    '#5A8EA1', Fairy:    '#FB89EB'
};

// 主系列屬性相剋表 (攻擊方 → {防守方: 倍率})
// 2 = 超級有效，0.5 = 效果不佳，0 = 無效（PoGo 視為 0.390625）
const TYPE_CHART = {
  Normal:   { Rock:0.5, Ghost:0, Steel:0.5 },
  Fire:     { Fire:0.5, Water:0.5, Grass:2, Ice:2, Bug:2, Rock:0.5, Dragon:0.5, Steel:2 },
  Water:    { Fire:2, Water:0.5, Grass:0.5, Ground:2, Rock:2, Dragon:0.5 },
  Electric: { Water:2, Electric:0.5, Grass:0.5, Ground:0, Flying:2, Dragon:0.5 },
  Grass:    { Fire:0.5, Water:2, Grass:0.5, Poison:0.5, Ground:2, Flying:0.5, Bug:0.5, Rock:2, Dragon:0.5, Steel:0.5 },
  Ice:      { Fire:0.5, Water:0.5, Grass:2, Ground:2, Flying:2, Dragon:2, Ice:0.5, Steel:0.5 },
  Fighting: { Normal:2, Ice:2, Poison:0.5, Flying:0.5, Psychic:0.5, Bug:0.5, Rock:2, Ghost:0, Dark:2, Steel:2, Fairy:0.5 },
  Poison:   { Grass:2, Poison:0.5, Ground:0.5, Rock:0.5, Ghost:0.5, Steel:0, Fairy:2 },
  Ground:   { Fire:2, Electric:2, Grass:0.5, Poison:2, Flying:0, Bug:0.5, Rock:2, Steel:2 },
  Flying:   { Electric:0.5, Grass:2, Fighting:2, Bug:2, Rock:0.5, Steel:0.5 },
  Psychic:  { Fighting:2, Poison:2, Psychic:0.5, Dark:0, Steel:0.5 },
  Bug:      { Fire:0.5, Grass:2, Fighting:0.5, Flying:0.5, Psychic:2, Ghost:0.5, Dark:2, Steel:0.5, Fairy:0.5 },
  Rock:     { Fire:2, Ice:2, Fighting:0.5, Ground:0.5, Flying:2, Bug:2, Steel:0.5 },
  Ghost:    { Normal:0, Psychic:2, Ghost:2, Dark:0.5 },
  Dragon:   { Dragon:2, Steel:0.5, Fairy:0 },
  Dark:     { Fighting:0.5, Psychic:2, Ghost:2, Dark:0.5, Fairy:0.5 },
  Steel:    { Fire:0.5, Water:0.5, Electric:0.5, Ice:2, Rock:2, Steel:0.5, Fairy:2 },
  Fairy:    { Fire:0.5, Fighting:2, Poison:0.5, Dragon:2, Dark:2, Steel:0.5 }
};

// PoGo 倍率轉換（主系列 → PoGo）
function toPogoMult(base) {
  if (base === 2)   return 1.6;
  if (base === 0.5) return 0.625;
  if (base === 0)   return 0.390625; // 免疫 → 超不佳
  return 1;
}

// 取得攻擊方對防守方的 PoGo 倍率
function getEff(attacker, defender) {
  const base = TYPE_CHART[attacker]?.[defender] ?? 1;
  return toPogoMult(base);
}

// 倍率分類（支援雙屬性複合值）
function getCategory(mult) {
  if (mult >= 2.0)  return 'super2';   // ×2.56
  if (mult >= 1.4)  return 'super1';   // ×1.6
  if (mult >= 0.9)  return 'neutral';  // ×1
  if (mult >= 0.5)  return 'resist1';  // ×0.625
  if (mult >= 0.28) return 'resist2';  // ×0.390625
  return 'resist3';                    // ×0.244 以下
}

// ── 狀態 ──────────────────────────────────────────────
let mode = 'attack';
let selectedTypes = [];

// ── 文字顏色（根據背景亮度自動選黑/白）──────────────
function textColor(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.62 ? '#222' : '#fff';
}

// ── 初始化 ────────────────────────────────────────────
function init() {
  renderGrid();
  renderResults();
}

function renderGrid() {
  const grid = document.getElementById('typeGrid');
  grid.innerHTML = '';
  TYPES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'type-btn';
    btn.style.background = TYPE_COLORS[t];
    btn.style.color = textColor(TYPE_COLORS[t]);
    btn.textContent = TYPE_ZH[t];
    btn.dataset.type = t;
    btn.addEventListener('click', () => selectType(t));
    grid.appendChild(btn);
  });
  updateGridHighlight();
}

function updateGridHighlight() {
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.classList.toggle('selected', selectedTypes.includes(btn.dataset.type));
  });
}

function selectType(t) {
  if (mode === 'attack') {
    selectedTypes = selectedTypes[0] === t ? [] : [t];
  } else {
    const idx = selectedTypes.indexOf(t);
    if (idx >= 0) {
      selectedTypes.splice(idx, 1);
    } else if (selectedTypes.length < 2) {
      selectedTypes.push(t);
    } else {
      selectedTypes = [selectedTypes[1], t];
    }
  }
  updateGridHighlight();
  renderResults();
}

function setMode(m) {
  mode = m;
  selectedTypes = [];
  document.getElementById('tab-attack').classList.toggle('active', m === 'attack');
  document.getElementById('tab-defense').classList.toggle('active', m === 'defense');
  document.getElementById('defenseHint').style.display = m === 'defense' ? 'block' : 'none';
  document.getElementById('gridLabel').textContent = m === 'attack' ? '選擇攻擊屬性' : '選擇防禦屬性';
  updateGridHighlight();
  renderResults();
}

// ── 結果渲染 ──────────────────────────────────────────
function renderResults() {
  const el = document.getElementById('results');
  if (selectedTypes.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="icon">🎮</div>點選上方屬性<br>查看相剋關係</div>`;
    return;
  }
  mode === 'attack' ? renderAttack(el) : renderDefense(el);
}

function renderAttack(el) {
  const atk = selectedTypes[0];
  const groups = { super2:[], super1:[], neutral:[], resist1:[], resist2:[], resist3:[] };

  TYPES.forEach(def => {
    const mult = getEff(atk, def);
    groups[getCategory(mult)].push({ type: def, mult });
  });

  const sections = [
    { key:'super1',  emoji:'✅', label:'效果絕佳',  pill:'pill-160', mult:'×1.6' },
    { key:'resist1', emoji:'🔻', label:'效果不佳',  pill:'pill-062', mult:'×0.625' },
    { key:'resist2', emoji:'❌', label:'效果極差',  pill:'pill-039', mult:'×0.39' },
    { key:'neutral', emoji:'➖', label:'正常傷害',  pill:'pill-100', mult:'×1', collapse:true },
  ];

  let html = buildSelectedBadges('攻擊屬性') + buildSections(groups, sections);
  html += `<div class="pogo-note">Pokémon GO 倍率：效果絕佳 ×1.6 · 效果不佳 ×0.625 · 免疫 ×0.39</div>`;
  el.innerHTML = html;
}

function renderDefense(el) {
  const defTypes = selectedTypes;
  const groups = { super2:[], super1:[], neutral:[], resist1:[], resist2:[], resist3:[] };

  TYPES.forEach(atk => {
    let mult = 1;
    defTypes.forEach(def => { mult *= getEff(atk, def); });
    mult = Math.round(mult * 100000) / 100000;
    groups[getCategory(mult)].push({ type: atk, mult });
  });

  const sections = [
    { key:'super2',  emoji:'💀', label:'極度弱點',  pill:'pill-256', mult:'×2.56' },
    { key:'super1',  emoji:'⚠️',  label:'弱點',      pill:'pill-160', mult:'×1.6' },
    { key:'resist1', emoji:'🛡️', label:'耐性',      pill:'pill-062', mult:'×0.625' },
    { key:'resist2', emoji:'🔒', label:'強耐性',    pill:'pill-039', mult:'×0.39' },
    { key:'resist3', emoji:'⛔', label:'超強耐性',  pill:'pill-024', mult:'×0.24↓' },
    { key:'neutral', emoji:'➖', label:'正常傷害',  pill:'pill-100', mult:'×1', collapse:true },
  ];

  let html = buildSelectedBadges('防禦屬性') + buildSections(groups, sections);
  html += `<div class="pogo-note">Pokémon GO 倍率：效果絕佳 ×1.6 · 效果不佳 ×0.625 · 免疫 ×0.39</div>`;
  el.innerHTML = html;
}

function buildSelectedBadges(label) {
  const badges = selectedTypes.map(t =>
    `<span class="selected-badge" style="background:${TYPE_COLORS[t]};color:${textColor(TYPE_COLORS[t])}">${TYPE_ZH[t]}</span>`
  ).join('<span class="selected-divider">/</span>');
  return `<div class="selected-display">
    <span style="font-size:12px;color:var(--text2)">${label}</span>
    ${badges}
  </div>`;
}

function buildSections(groups, sections) {
  let html = '';
  sections.forEach(({ key, emoji, label, pill, mult, collapse }) => {
    const items = groups[key] || [];
    if (items.length === 0) return;

    if (collapse) {
      html += `<div class="eff-card neutral collapsible" onclick="this.classList.toggle('neutral');this.querySelector('.type-badges').style.display=this.classList.contains('neutral')?'none':'flex'">
        <div class="eff-header">
          <span>${emoji}</span>
          <span class="eff-label">${label}</span>
          <span class="eff-mult ${pill}">${mult}</span>
          <span class="eff-count">${items.length} 種 ▾</span>
        </div>
        <div class="type-badges" style="display:none">
          ${items.map(({ type: t }) => typeBadge(t)).join('')}
        </div>
      </div>`;
      return;
    }

    html += `<div class="eff-card">
      <div class="eff-header">
        <span>${emoji}</span>
        <span class="eff-label">${label}</span>
        <span class="eff-mult ${pill}">${mult}</span>
        <span class="eff-count">${items.length} 種</span>
      </div>
      <div class="type-badges">
        ${items.map(({ type: t }) => typeBadge(t)).join('')}
      </div>
    </div>`;
  });
  return html;
}

function typeBadge(t) {
  return `<span class="type-tag" style="background:${TYPE_COLORS[t]};color:${textColor(TYPE_COLORS[t])}">${TYPE_ZH[t]}</span>`;
}

// ── Service Worker ────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('pokego-types-sw.js')
    .catch(err => console.log('SW 註冊失敗:', err));
}

init();
</script>
</body>
</html>
